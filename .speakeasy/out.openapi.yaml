    delete:
      operationId: Organizations_delete
      description: |-
        Soft-delete. The delete runs in the background: this returns its
        long-running operation, which `OrganizationOperations` get and `:wait`
        follow until it is done, with the organization `DELETED`.
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
          example: acme
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          explode: false
          example: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationOperation'
              example:
                name: organizations/acme/operations/019a8f3e-4b2c-7d1e-9f3a-2c4b6d8e0f11
                done: false
                metadata:
                  target: organizations/acme
                  verb: delete
                  createTime: '2026-04-01T10:00:00Z'
                  passes: 1
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The caller is authorized for the requested resources, but this one does not exist.
          content:
            application/problem+json:
