components:
  schemas:
    CreateInvitation:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email of the person invited.
      description: |-
        An invitation to join an organization, addressed by email. The invitee
        accepts it by signing in with that email.
      examples:
        - email: bob@acme.example
    CreateMemory:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32768
          description: Plain text, at most 32 KiB in UTF-8.
      description: |-
        A piece of text an agent remembers. Creating one indexes it for the space's
        queries in the background; its content can't be changed.
      examples:
        - content: Deploys go through Flux; never kubectl apply to the dev cluster by hand.
    CreateOrganization:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: Human-readable name.
      description: 'An organization: the top-level container that owns all other resources.'
      examples:
        - displayName: Acme Corp
    CreateProject:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: Human-readable name.
      description: A project in a team. Its spaces hold memories.
      examples:
        - displayName: Agent
    CreateSpace:
      type: object
      required:
        - project
        - displayName
      properties:
        project:
          type: string
          description: |-
            The project the space belongs to:
            `organizations/{organization}/teams/{team}/projects/{project}`. It can't
            be changed later.
        displayName:
          type: string
          description: Human-readable name.
      description: |-
        A space holds memories, and is what agents query. Its ID is unique in the
        organization, and it belongs to a project, which decides who can use it.
      examples:
        - project: organizations/acme/teams/core/projects/agent
          displayName: Notes
    CreateTeam:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: Human-readable name.
      description: |-
        A team in an organization. Teams own projects, and through them spaces and
        memories.
      examples:
        - displayName: Core
    CreateTeamMember:
      type: object
      required:
        - member
      properties:
        member:
          type: string
          description: |-
            The organization member added to the team:
            `organizations/{organization}/members/{member}`.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MemberRole'
          description: Roles the member holds in the team. Empty for a plain member.
      description: |-
        An organization member's membership in a team. Organization admins manage
        every team without being members.
      examples:
        - member: organizations/acme/members/0196f1b8-2d4f-7a1c-8e3b-5c6d7e8f9a02
          roles:
            - admin
    Invitation:
      type: object
      required:
        - name
        - email
        - state
        - organizationDisplayName
        - invitedBy
        - inviterEmail
        - createdAt
        - updatedAt
        - expiresAt
      properties:
        name:
          type: string
          description: 'Resource name: `organizations/{organization}/invitations/{invitation}`.'
          readOnly: true
        email:
          type: string
          format: email
          description: Email of the person invited.
        state:
          $ref: '#/components/schemas/InvitationState'
          description: Where the invitation stands.
          readOnly: true
        organizationDisplayName:
          type: string
          description: The organization's name when the invitation was sent.
          readOnly: true
        invitedBy:
          type: string
          description: 'Name of the user who sent it: `users/{user}`.'
          readOnly: true
        inviterEmail:
          type: string
          description: Email of the user who sent it.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When the invitation was sent.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When the invitation was last updated.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: After this, the invitation can no longer be accepted.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
      description: |-
        An invitation to join an organization, addressed by email. The invitee
        accepts it by signing in with that email.
      examples:
        - name: organizations/acme/invitations/0196f1c4-9a2b-7e3d-8f1c-6a7b8c9d0e03
          email: bob@acme.example
          state: pending
          organizationDisplayName: Acme Corp
          invitedBy: users/9b2f4c1e-5a3d-4e7b-8c6f-1d2e3f4a5b6c
          inviterEmail: alice@acme.example
          createdAt: '2026-02-01T10:00:00Z'
          updatedAt: '2026-02-01T10:00:00Z'
          expiresAt: '2026-02-15T10:00:00Z'
    InvitationState:
      type: string
      enum:
        - pending
        - accepted
        - declined
      description: Where an invitation stands.
      examples:
        - pending
