    MemoryLabel:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]{0,31}$
      description: 'A free-form label: lowercase letters, digits and dashes, at most 32.'
    MemoryOrigin:
      type: object
      required:
        - name
        - createdBy
        - createdAt
      properties:
        name:
          type: string
          description: The memory's resource name where it was created.
        createdBy:
          type: string
          description: Who created it there.
        createdWith:
          type: string
          description: The agent that created it there, if any.
        createdAt:
          type: string
          format: date-time
          description: When it was created there.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
      description: |-
        An imported memory's original identity. `createdBy` and `createdAt` on the
        memory itself stay the import's.
    Organization:
      type: object
      required:
        - name
        - displayName
        - state
        - createdBy
        - createdAt
        - updatedAt
      properties:
        name:
          type: string
          readOnly: true
        displayName:
          type: string
          description: Human-readable name.
        state:
          $ref: '#/components/schemas/OrganizationState'
          description: Current lifecycle state.
          readOnly: true
        createdBy:
          type: string
          description: Name of the user that created the organization.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When the organization was created.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When the organization was last updated.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        deletedAt:
          type: string
          format: date-time
          description: When the organization was soft-deleted. Set only while deleted.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        purgesAt:
          type: string
          format: date-time
          description: When a soft-deleted organization will be permanently purged.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          description: |-
            The methods the caller may call on this resource, such as `delete`.
            Returned only with `include=permissions`.
          readOnly: true
      description: 'An organization: the top-level container that owns all other resources.'
      examples:
        - name: organizations/acme
          displayName: Acme Corp
          state: active
          createdBy: users/alice
          createdAt: '2026-01-15T09:30:00Z'
          updatedAt: '2026-03-02T14:05:00Z'
    OrganizationState:
      type: string
      enum:
        - active
        - deleting
        - deleted
        - restoring
      description: Lifecycle state of an organization.
      examples:
        - active
    Problem:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
      description: RFC 9457 Problem Details. The body of every error response.
      examples:
        - title: Not Found
          status: 404
          detail: organizations/acme does not exist.
    Project:
      type: object
      required:
        - name
        - displayName
        - createdBy
        - createdAt
      properties:
        name:
          type: string
          description: 'Resource name: `organizations/{organization}/projects/{project}`.'
          readOnly: true
        displayName:
          type: string
          description: Human-readable name.
        createdBy:
          type: string
          description: Name of the user that created the project.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When the project was created.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          description: |-
            The methods the caller may call on this resource, such as `delete`.
            Returned only with `include=permissions`.
          readOnly: true
      description: |-
        A project in an organization. Its members use its spaces, which hold
        memories.
      examples:
        - name: organizations/acme/projects/agent
          displayName: Agent
          createdBy: users/4e1a2b3c-6d5f-4a8b-9c7e-2f3a4b5c6d7e
          createdAt: '2026-02-06T10:00:00Z'
    ProjectMember:
      type: object
      required:
        - name
        - member
        - user
        - email
        - displayName
        - createdAt
      properties:
        name:
          type: string
          description: 'Resource name: `organizations/{organization}/projects/{project}/members/{member}`.'
          readOnly: true
        member:
          type: string
          description: |-
            The organization member added to the project:
            `organizations/{organization}/members/{member}`.
        user:
          type: string
          description: "Name of the member's user: `users/{user}`."
          readOnly: true
        email:
          type: string
          description: The user's email, from their organization membership.
          readOnly: true
        displayName:
          type: string
          description: The user's name, from their organization membership.
          readOnly: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MemberRole'
          description: Roles the member holds in the project. Empty for a plain member.
        createdAt:
          type: string
          format: date-time
          description: When the member was added to the project.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          description: |-
            The methods the caller may call on this resource, such as `delete`.
            Returned only with `include=permissions`.
          readOnly: true
      description: |-
        An organization member's membership in a project. Organization admins
        manage every project without being members.
      examples:
        - name: organizations/acme/projects/agent/members/0196f1d0-3b4c-7d5e-9f1a-2b3c4d5e6f04
          member: organizations/acme/members/0196f1b8-2d4f-7a1c-8e3b-5c6d7e8f9a02
          user: users/4e1a2b3c-6d5f-4a8b-9c7e-2f3a4b5c6d7e
          email: bob@acme.example
          displayName: Bob Jones
          roles:
            - admin
          createdAt: '2026-02-05T09:05:00Z'
    QueryResult:
      type: object
      required:
        - memory
        - content
        - score
        - kind
      properties:
        memory:
          type: string
          description: Resource name of the memory.
        content:
          type: string
          description: The part of the memory that matched.
        score:
          type: number
          format: double
          description: Relevance to the query, from 0 to 1. Higher is more relevant.
        kind:
          $ref: '#/components/schemas/MemoryKind'
          description: What the memory is.
        labels:
          type: array
          items:
            $ref: '#/components/schemas/MemoryLabel'
          description: The memory's labels.
        source:
          type: string
          description: Where the memory's content comes from.
      description: A memory that matches a query.
    QuerySpaceRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2048
          description: The question, in natural language. At most 2 KiB in UTF-8.
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          description: The most results to return. Defaults to 10.
          default: 10
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/MemoryKind'
          maxItems: 5
          description: Keeps memories of any of these kinds. All kinds when absent.
        labels:
          type: array
          items:
            $ref: '#/components/schemas/MemoryLabel'
          maxItems: 10
          description: Keeps memories that have every one of these labels.
      description: A question to search a space's memories with.
      examples:
        - query: How do deploys work?
          pageSize: 5
    QuerySpaceResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/QueryResult'
          description: The matching memories.
      description: |-
        The best matches, most relevant first, at most one per memory. Memories
        become searchable shortly after they're created, and stop matching shortly
        after they're deleted.
      examples:
        - results:
            - memory: organizations/acme/spaces/notes/memories/019ad6a0-3c4e-7b8a-9d2f-5e6a7b8c9d0e
              content: Deploys go through Flux; never kubectl apply to the dev cluster by hand.
              score: 0.91
              kind: note
              labels:
                - deploys
    Space:
      type: object
      required:
        - name
        - project
        - displayName
        - state
        - createdBy
        - createdAt
      properties:
        name:
          type: string
          description: 'Resource name: `organizations/{organization}/spaces/{space}`.'
          readOnly: true
        project:
          type: string
          description: |-
            The project the space belongs to:
            `organizations/{organization}/projects/{project}`. It can't
            be changed later.
        displayName:
          type: string
          description: Human-readable name.
        state:
          $ref: '#/components/schemas/SpaceState'
          description: Current lifecycle state.
          readOnly: true
        createdBy:
          type: string
          description: Name of the user that created the space.
          readOnly: true
        createdWith:
          type: string
          description: |-
            Name of the agent that created the space for the user: `agents/{agent}`
            for an agent the user connected. Absent when the user created it
            themselves.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When the space was created.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          description: |-
            The methods the caller may call on this resource, such as `delete`.
            Returned only with `include=permissions`.
          readOnly: true
      description: |-
        A space holds memories, and is what agents query. Its ID is unique in the
        organization, and it belongs to a project, which decides who can use it.
      examples:
        - name: organizations/acme/spaces/notes
          project: organizations/acme/projects/agent
          displayName: Notes
          state: active
          createdBy: users/4e1a2b3c-6d5f-4a8b-9c7e-2f3a4b5c6d7e
          createdAt: '2026-02-07T11:00:00Z'
    SpaceState:
      type: string
      enum:
        - active
        - deleting
        - deleted
        - restoring
      description: Lifecycle state of a space.
      examples:
        - active
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
