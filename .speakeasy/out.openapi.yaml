              example:
                name: organizations/acme/invitations/0196f1c4-9a2b-7e3d-8f1c-6a7b8c9d0e03
                email: bob@acme.example
                state: accepted
                organizationDisplayName: Acme Corp
                invitedBy: users/9b2f4c1e-5a3d-4e7b-8c6f-1d2e3f4a5b6c
