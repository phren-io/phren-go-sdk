paths:
  /v1/organizations:
    get:
      operationId: Organizations_list
      description: List
      parameters:
        - name: pageSize
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
          examples:
            Next page:
              summary: Next page
              value: 50
            First page:
              summary: First page
              value: 50
        - name: pageToken
          in: query
          required: false
          description: Token from a previous response's nextPageToken.
          schema:
            type: string
          explode: false
          examples:
            Next page:
              summary: Next page
              value: CiAKGjBpNDd2Nmp2
        - name: filter
          in: query
          required: false
          description: AIP-160 filter expression.
          schema:
            type: string
            maxLength: 1024
          explode: false
          examples:
            Next page:
              summary: Next page
              value: state = "ACTIVE"
        - name: include
          in: query
          required: false
          description: |-
            Extra data to return. With `permissions`, each resource lists the methods
            the caller may call on it, and a list response the methods on the
            collection. Rules that depend on data, such as keeping the last admin, are
            still checked when the method is called.
          schema:
            $ref: '#/components/schemas/Include'
          explode: false
        - name: showDeleted
          in: query
          required: false
          description: Include soft-deleted resources in the results.
          schema:
            type: boolean
            default: false
          explode: false
          examples:
            First page:
              summary: First page
              value: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationsResponse'
              examples:
                Next page:
                  summary: Next page
                  value:
                    organizations:
                      - name: organizations/acme
                        displayName: Acme Corp
                        state: active
                        createdBy: users/alice
                        createdAt: '2026-01-15T09:30:00Z'
                        updatedAt: '2026-03-02T14:05:00Z'
                First page:
                  summary: First page
                  value:
                    organizations:
                      - name: organizations/acme
                        displayName: Acme Corp
                        state: active
                        createdBy: users/alice
                        createdAt: '2026-01-15T09:30:00Z'
                        updatedAt: '2026-03-02T14:05:00Z'
                    nextPageToken: CiAKGjBpNDd2Nmp2
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
      x-speakeasy-pagination:
        type: cursor
        inputs:
          - name: pageToken
            in: parameters
            type: cursor
        outputs:
          nextCursor: $.nextPageToken
    post:
      operationId: Organizations_create
      description: Create
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
          explode: false
          example: acme
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                name: organizations/acme
                displayName: Acme Corp
                state: active
                createdBy: users/alice
                createdAt: '2026-01-15T09:30:00Z'
                updatedAt: '2026-03-02T14:05:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the resource's current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
            example:
              displayName: Acme Corp
  /v1/organizations/{organization}:
