openapi: 3.1.0
info:
  title: Phren API
  version: 0.0.0
tags:
  - name: organizations
paths:
  /v1/organizations:
    get:
      operationId: Organizations_list
      description: List
      parameters:
        - name: pageSize
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
          examples:
            Next page:
              summary: Next page
              value: 50
            First page:
              summary: First page
              value: 50
        - name: pageToken
          in: query
          required: false
          description: Token from a previous response's nextPageToken.
          schema:
            type: string
          explode: false
          examples:
            Next page:
              summary: Next page
              value: CiAKGjBpNDd2Nmp2
        - name: filter
          in: query
          required: false
          description: AIP-160 filter expression.
          schema:
            type: string
            maxLength: 1024
          explode: false
          examples:
            Next page:
              summary: Next page
              value: state = "ACTIVE"
        - name: showDeleted
          in: query
          required: false
          description: Include soft-deleted resources in the results.
          schema:
            type: boolean
            default: false
          explode: false
          examples:
            First page:
              summary: First page
              value: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationsResponse'
              examples:
                Next page:
                  summary: Next page
                  value:
                    organizations:
                      - name: organizations/acme
                        displayName: Acme Corp
                        state: active
                        createdBy: users/alice
                        createdAt: '2026-01-15T09:30:00Z'
                        updatedAt: '2026-03-02T14:05:00Z'
                First page:
                  summary: First page
                  value:
                    organizations:
                      - name: organizations/acme
                        displayName: Acme Corp
                        state: active
                        createdBy: users/alice
                        createdAt: '2026-01-15T09:30:00Z'
                        updatedAt: '2026-03-02T14:05:00Z'
                    nextPageToken: CiAKGjBpNDd2Nmp2
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
      x-speakeasy-pagination:
        type: cursor
        inputs:
          - name: pageToken
            in: parameters
            type: cursor
        outputs:
          nextCursor: $.nextPageToken
    post:
      operationId: Organizations_create
      description: Create
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
          explode: false
          example: acme
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                name: organizations/acme
                displayName: Acme Corp
                state: active
                createdBy: users/alice
                createdAt: '2026-01-15T09:30:00Z'
                updatedAt: '2026-03-02T14:05:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the resource's current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
            example:
              displayName: Acme Corp
  /v1/organizations/{organization}:
    get:
      operationId: Organizations_get
      description: Get
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
          example: acme
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                name: organizations/acme
                displayName: Acme Corp
                state: active
                createdBy: users/alice
                createdAt: '2026-01-15T09:30:00Z'
                updatedAt: '2026-03-02T14:05:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The caller is authorized for the requested resources, but this one does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
    delete:
      operationId: Organizations_delete
      description: Soft-delete
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
          example: acme
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          explode: false
          example: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                name: organizations/acme
                displayName: Acme Corp
                state: deleted
                createdBy: users/alice
                createdAt: '2026-01-15T09:30:00Z'
                updatedAt: '2026-04-01T10:00:00Z'
                deletedAt: '2026-04-01T10:00:00Z'
                purgesAt: '2026-05-01T10:00:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The caller is authorized for the requested resources, but this one does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the resource's current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
  /v1/organizations/{organization}:undelete:
    post:
      operationId: Organizations_undelete
      description: Undelete
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
          example: acme
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                name: organizations/acme
                displayName: Acme Corp
                state: active
                createdBy: users/alice
                createdAt: '2026-01-15T09:30:00Z'
                updatedAt: '2026-03-02T14:05:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The caller is authorized for the requested resources, but this one does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the resource's current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
security:
  - BearerAuth: []
components:
  schemas:
    CreateOrganization:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: Human-readable name.
      description: 'An organization: the top-level container that owns all other resources.'
      examples:
        - displayName: Acme Corp
    ListOrganizationsResponse:
      type: object
      required:
        - organizations
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
          description: The organizations on this page.
        nextPageToken:
          type: string
          description: Token for the next page. Absent on the last page.
      description: A page of organizations.
      examples:
        - organizations:
            - name: organizations/acme
              displayName: Acme Corp
              state: active
              createdBy: users/alice
              createdAt: '2026-01-15T09:30:00Z'
              updatedAt: '2026-03-02T14:05:00Z'
          nextPageToken: CiAKGjBpNDd2Nmp2
    Organization:
      type: object
      required:
        - name
        - displayName
        - state
        - createdBy
        - createdAt
        - updatedAt
      properties:
        name:
          type: string
          readOnly: true
        displayName:
          type: string
          description: Human-readable name.
        state:
          $ref: '#/components/schemas/OrganizationState'
          description: Current lifecycle state.
          readOnly: true
        createdBy:
          type: string
          description: Name of the user that created the organization.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When the organization was created.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When the organization was last updated.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        deletedAt:
          type: string
          format: date-time
          description: When the organization was soft-deleted. Set only while deleted.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        purgesAt:
          type: string
          format: date-time
          description: When a soft-deleted organization will be permanently purged.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
      description: 'An organization: the top-level container that owns all other resources.'
      examples:
        - name: organizations/acme
          displayName: Acme Corp
          state: active
          createdBy: users/alice
          createdAt: '2026-01-15T09:30:00Z'
          updatedAt: '2026-03-02T14:05:00Z'
    OrganizationState:
      type: string
      enum:
        - active
        - deleting
        - deleted
        - restoring
      description: Lifecycle state of an organization.
      examples:
        - active
    Problem:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
      description: RFC 9457 Problem Details. The body of every error response.
      examples:
        - title: Not Found
          status: 404
          detail: organizations/acme does not exist.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: https://api.phren.io
    description: The production server
    variables: {}
  - url: https://staging.api.phren.io
    description: The staging server
    variables: {}
x-speakeasy-retries:
  strategy: backoff
  backoff:
    initialInterval: 10
    maxInterval: 200
    maxElapsedTime: 1000
    exponent: 1.5
  statusCodes:
    - '429'
    - 5XX
  retryConnectionErrors: true
x-speakeasy-name-override:
  - operationId: ^.+_list$
    methodNameOverride: list
  - operationId: ^.+_get$
    methodNameOverride: get
  - operationId: ^.+_create$
    methodNameOverride: create
  - operationId: ^.+_delete$
    methodNameOverride: delete
  - operationId: ^.+_undelete$
    methodNameOverride: undelete
