openapi: 3.1.0
info:
  title: Resource Manager
  version: 0.0.0
tags: []
paths:
  /organizations:
    get:
      operationId: Organizations_listOrganizations
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
      x-speakeasy-group: organizations
      x-speakeasy-name-override: list
    post:
      operationId: Organizations_createOrganization
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      x-speakeasy-group: organizations
      x-speakeasy-name-override: create
  /organizations/{organizationId}:
    get:
      operationId: Organizations_getOrganization
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
      x-speakeasy-group: organizations
      x-speakeasy-name-override: get
    delete:
      operationId: Organizations_deleteOrganization
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      x-speakeasy-group: organizations
      x-speakeasy-name-override: delete
components:
  schemas:
    Organization:
      type: object
      required:
        - uid
        - id
        - owner
        - display_name
        - state
        - create_time
        - update_time
        - purge_time
      properties:
        uid:
          type: string
        id:
          type: string
        owner:
          type: string
        display_name:
          type: string
        state:
          $ref: '#/components/schemas/organizationState'
        create_time:
          type: string
          format: date-time
        update_time:
          type: string
          format: date-time
        purge_time:
          type: string
          format: date-time
    organizationState:
      type: string
      enum:
        - STATE_UNSPECIFIED
        - ACTIVE
        - DELETING
        - RESTORING
        - PURGING
        - FAILED
servers:
  - url: https://api.phren.io
    variables: {}
