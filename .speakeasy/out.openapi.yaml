openapi: 3.1.0
info:
  title: Phren API
  version: v1
tags:
  - name: organizations
paths:
  /organizations:
    get:
      operationId: Organizations_list
      description: List the organizations the caller can access.
      parameters:
        - name: page_size
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
          explode: false
          examples:
            Fetch the next page of active organizations:
              summary: Fetch the next page of active organizations
              value: 50
            List organizations:
              summary: List organizations
              value: 50
        - name: page_token
          in: query
          required: false
          description: Token from a previous page's links, to fetch the next page.
          schema:
            type: string
          explode: false
          examples:
            Fetch the next page of active organizations:
              summary: Fetch the next page of active organizations
              value: CiAKGjBpNDd2Nmp2
        - name: filter
          in: query
          required: false
          description: AIP-160 filter expression.
          schema:
            type: string
          explode: false
          examples:
            Fetch the next page of active organizations:
              summary: Fetch the next page of active organizations
              value: state = "ACTIVE"
        - name: show_deleted
          in: query
          required: false
          description: Include soft-deleted resources in the results.
          schema:
            type: boolean
          explode: false
          examples:
            List organizations:
              summary: List organizations
              value: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationsResponse'
              examples:
                Fetch the next page of active organizations:
                  summary: Fetch the next page of active organizations
                  value:
                    self: https://api.phren.io/organizations?page_size=50
                    first: https://api.phren.io/organizations?page_size=50
                    next: https://api.phren.io/organizations?page_size=50&page_token=CiAKGjBpNDd2Nmp2
                    organizations:
                      - name: organizations/acme
                        uid: 0f8fad5b-d9cb-469f-a165-70867728950e
                        display_name: Acme Corp
                        state: ACTIVE
                        owner: users/wile-e
                        created_at: '2026-01-15T09:30:00Z'
                        updated_at: '2026-03-02T14:05:00Z'
                List organizations:
                  summary: List organizations
                  value:
                    self: https://api.phren.io/organizations?page_size=50
                    first: https://api.phren.io/organizations?page_size=50
                    next: https://api.phren.io/organizations?page_size=50&page_token=CiAKGjBpNDd2Nmp2
                    organizations:
                      - name: organizations/acme
                        uid: 0f8fad5b-d9cb-469f-a165-70867728950e
                        display_name: Acme Corp
                        state: ACTIVE
                        owner: users/wile-e
                        created_at: '2026-01-15T09:30:00Z'
                        updated_at: '2026-03-02T14:05:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
      x-speakeasy-pagination:
        type: url
        outputs:
          nextUrl: $.next
    post:
      operationId: Organizations_create
      description: Create an organization.
      parameters:
        - name: organization_id
          in: query
          required: true
          description: ID of the new organization; becomes the last segment of its name.
          schema:
            $ref: '#/components/schemas/ResourceId'
          explode: false
          examples:
            Create an organization:
              summary: Create an organization
              value: acme
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              examples:
                Create an organization:
                  summary: Create an organization
                  value:
                    name: organizations/acme
                    uid: 0f8fad5b-d9cb-469f-a165-70867728950e
                    display_name: Acme Corp
                    state: ACTIVE
                    owner: users/wile-e
                    created_at: '2026-01-15T09:30:00Z'
                    updated_at: '2026-03-02T14:05:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the resource's current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
            examples:
              Create an organization:
                summary: Create an organization
                value:
                  name: organizations/acme
                  uid: 0f8fad5b-d9cb-469f-a165-70867728950e
                  display_name: Acme Corp
                  state: ACTIVE
                  owner: users/wile-e
                  created_at: '2026-01-15T09:30:00Z'
                  updated_at: '2026-03-02T14:05:00Z'
  /organizations/{organization}:
    get:
      operationId: Organizations_get
      description: Get an organization.
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ResourceId'
          examples:
            Get an organization:
              summary: Get an organization
              value: acme
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              examples:
                Get an organization:
                  summary: Get an organization
                  value:
                    name: organizations/acme
                    uid: 0f8fad5b-d9cb-469f-a165-70867728950e
                    display_name: Acme Corp
                    state: ACTIVE
                    owner: users/wile-e
                    created_at: '2026-01-15T09:30:00Z'
                    updated_at: '2026-03-02T14:05:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The caller is authorized for the requested resources, but this one does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
    delete:
      operationId: Organizations_delete
      description: Soft-delete an organization. It can be undeleted until `purges_at`.
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ResourceId'
          examples:
            Delete an organization:
              summary: Delete an organization
              value: acme
        - name: force
          in: query
          required: false
          description: Also delete the organization's child resources.
          schema:
            type: boolean
          explode: false
          examples:
            Delete an organization:
              summary: Delete an organization
              value: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              examples:
                Delete an organization:
                  summary: Delete an organization
                  value:
                    name: organizations/acme
                    uid: 0f8fad5b-d9cb-469f-a165-70867728950e
                    display_name: Acme Corp
                    state: DELETED
                    owner: users/wile-e
                    created_at: '2026-01-15T09:30:00Z'
                    updated_at: '2026-04-01T10:00:00Z'
                    deleted_at: '2026-04-01T10:00:00Z'
                    purges_at: '2026-05-01T10:00:00Z'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The caller is authorized for the requested resources, but this one does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the resource's current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
  /organizations/{organization}:undelete:
    post:
      operationId: Organizations_undelete
      description: Restore a soft-deleted organization (AIP-164).
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ResourceId'
          examples:
            Undelete an organization:
              summary: Undelete an organization
              value: acme
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              examples:
                Undelete an organization:
                  summary: Undelete an organization
                  value:
                    name: organizations/acme
                    uid: 0f8fad5b-d9cb-469f-a165-70867728950e
                    display_name: Acme Corp
                    state: ACTIVE
                    owner: users/wile-e
                    created_at: '2026-01-15T09:30:00Z'
                    updated_at: '2026-03-02T14:05:00Z'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The caller is authorized for the requested resources, but this one does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the resource's current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
components:
  schemas:
    DisplayName:
      type: string
      pattern: ^[^\n]{1,63}$
      description: 'Human-readable name: 1-63 characters, single line.'
      examples:
        - Acme Corp
    ListOrganizationsResponse:
      type: object
      required:
        - self
        - first
        - organizations
      properties:
        self:
          type: string
          format: uri
          description: URL of this page.
        first:
          type: string
          format: uri
          description: URL of the first page.
        prev:
          type: string
          format: uri
          description: URL of the previous page. Absent on the first page.
        next:
          type: string
          format: uri
          description: URL of the next page. Absent on the last page.
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
          description: The organizations on this page.
      description: A page of organizations.
      examples:
        - self: https://api.phren.io/organizations?page_size=50
          first: https://api.phren.io/organizations?page_size=50
          next: https://api.phren.io/organizations?page_size=50&page_token=CiAKGjBpNDd2Nmp2
          organizations:
            - name: organizations/acme
              uid: 0f8fad5b-d9cb-469f-a165-70867728950e
              display_name: Acme Corp
              state: ACTIVE
              owner: users/wile-e
              created_at: '2026-01-15T09:30:00Z'
              updated_at: '2026-03-02T14:05:00Z'
    Organization:
      type: object
      required:
        - name
        - uid
        - display_name
        - state
        - owner
        - created_at
        - updated_at
      properties:
        name:
          type: string
          pattern: ^organizations/[a-z][a-z0-9-]{2,62}$
          description: Resource name, `organizations/{organization_id}`. Set by the server on create.
          readOnly: true
        uid:
          type: string
          description: A system assigned unique identifier.
          readOnly: true
        display_name:
          $ref: '#/components/schemas/DisplayName'
          description: Human-readable name.
        state:
          $ref: '#/components/schemas/OrganizationState'
          description: Current lifecycle state.
          readOnly: true
        owner:
          type: string
          pattern: ^users/[a-z][a-z0-9-]{2,62}$
          description: Name of the user that owns the organization.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: When the organization was created.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: When the organization was last updated.
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          description: When the organization was soft-deleted. Set only while deleted.
          readOnly: true
        purges_at:
          type: string
          format: date-time
          description: When a soft-deleted organization will be permanently purged.
          readOnly: true
      description: 'An organization: the top-level container that owns all other resources.'
      examples:
        - name: organizations/acme
          uid: 0f8fad5b-d9cb-469f-a165-70867728950e
          display_name: Acme Corp
          state: ACTIVE
          owner: users/wile-e
          created_at: '2026-01-15T09:30:00Z'
          updated_at: '2026-03-02T14:05:00Z'
    OrganizationState:
      type: string
      enum:
        - ACTIVE
        - DELETING
        - DELETED
        - RESTORING
      description: Lifecycle state of an organization.
      examples:
        - ACTIVE
    Problem:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
      description: RFC 9457 Problem Details. The body of every error response.
      examples:
        - title: Not Found
          status: 404
          detail: organizations/acme does not exist.
    ResourceId:
      type: string
      pattern: ^[a-z][a-z0-9-]{2,62}$
      description: The ID segment of a resource name, e.g. `acme` in `organizations/acme`.
      examples:
        - acme
servers:
  - url: https://api.phren.io
    description: The production server
    variables: {}
  - url: https://staging.api.phren.io
    description: The staging server
    variables: {}
x-speakeasy-retries:
  strategy: backoff
  backoff:
    initialInterval: 10
    maxInterval: 200
    maxElapsedTime: 1000
    exponent: 1.5
  statusCodes:
    - '429'
    - 5XX
  retryConnectionErrors: true
x-speakeasy-name-override:
  - operationId: ^.+_list$
    methodNameOverride: list
  - operationId: ^.+_get$
    methodNameOverride: get
  - operationId: ^.+_create$
    methodNameOverride: create
  - operationId: ^.+_delete$
    methodNameOverride: delete
  - operationId: ^.+_undelete$
    methodNameOverride: undelete
