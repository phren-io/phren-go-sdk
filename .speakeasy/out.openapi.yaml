  /v1/organizations/{organization}/invitations:
    get:
      operationId: Invitations_list
      description: |-
        List. Admins list an organization's invitations. With `-` as the
        organization, lists the pending invitations addressed to the caller's
        email, across organizations.
      parameters:
        - name: pageSize
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
          examples:
            Addressed to me:
              summary: Addressed to me
              value: 50
            An organization's:
              summary: An organization's
              value: 50
        - name: pageToken
          in: query
          required: false
          description: Token from a previous response's nextPageToken.
          schema:
            type: string
          explode: false
        - name: filter
          in: query
          required: false
          description: AIP-160 filter expression.
          schema:
            type: string
            maxLength: 1024
          explode: false
        - name: organization
          in: path
          required: true
          schema:
            type: string
          examples:
            Addressed to me:
              summary: Addressed to me
              value: '-'
            An organization's:
              summary: An organization's
              value: acme
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInvitationsResponse'
              examples:
                Addressed to me:
                  summary: Addressed to me
                  value:
                    invitations:
                      - name: organizations/acme/invitations/0196f1c4-9a2b-7e3d-8f1c-6a7b8c9d0e03
                        email: bob@acme.example
                        state: pending
                        organizationDisplayName: Acme Corp
                        invitedBy: users/9b2f4c1e-5a3d-4e7b-8c6f-1d2e3f4a5b6c
                        inviterEmail: alice@acme.example
                        createdAt: '2026-02-01T10:00:00Z'
                        updatedAt: '2026-02-01T10:00:00Z'
                        expiresAt: '2026-02-15T10:00:00Z'
                An organization's:
                  summary: An organization's
                  value:
                    invitations:
                      - name: organizations/acme/invitations/0196f1c4-9a2b-7e3d-8f1c-6a7b8c9d0e03
                        email: bob@acme.example
                        state: pending
                        organizationDisplayName: Acme Corp
                        invitedBy: users/9b2f4c1e-5a3d-4e7b-8c6f-1d2e3f4a5b6c
                        inviterEmail: alice@acme.example
                        createdAt: '2026-02-01T10:00:00Z'
                        updatedAt: '2026-02-01T10:00:00Z'
                        expiresAt: '2026-02-15T10:00:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - invitations
      x-speakeasy-pagination:
        type: cursor
        inputs:
          - name: pageToken
            in: parameters
            type: cursor
        outputs:
          nextCursor: $.nextPageToken
    post:
      operationId: Invitations_create
      description: |-
        Invite someone by email. Fails with 409 if they're already a member or
        already have a pending invitation.
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
          example: acme
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
              example:
                name: organizations/acme/invitations/0196f1c4-9a2b-7e3d-8f1c-6a7b8c9d0e03
                email: bob@acme.example
                state: pending
                organizationDisplayName: Acme Corp
                invitedBy: users/9b2f4c1e-5a3d-4e7b-8c6f-1d2e3f4a5b6c
                inviterEmail: alice@acme.example
                createdAt: '2026-02-01T10:00:00Z'
                updatedAt: '2026-02-01T10:00:00Z'
                expiresAt: '2026-02-15T10:00:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the resource's current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
