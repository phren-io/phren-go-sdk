components:
  schemas:
    CreateInvitation:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email of the person invited.
      description: |-
        An invitation to join an organization, addressed by email. The invitee
        accepts it by signing in with that email.
      examples:
        - email: bob@acme.example
    CreateMemory:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32768
          description: Plain text, at most 32 KiB in UTF-8.
        kind:
          $ref: '#/components/schemas/MemoryKind'
          description: What the memory is. Defaults to `note`.
          default: note
        labels:
          type: array
          items:
            $ref: '#/components/schemas/MemoryLabel'
          maxItems: 10
          description: Labels the caller picks, such as a chapter or a topic. At most 10.
        source:
          type: string
          maxLength: 512
          description: |-
            Where the content comes from, such as a book, chapter and page, or a URL.
            At most 512 bytes.
      description: |-
        A piece of text an agent remembers. Creating one indexes it for the space's
        queries in the background; its content can't be changed.
      examples:
        - content: Deploys go through Flux; never kubectl apply to the dev cluster by hand.
          kind: note
          labels:
            - deploys
    CreateOrganization:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: Human-readable name.
      description: 'An organization: the top-level container that owns all other resources.'
      examples:
        - displayName: Acme Corp
    CreateProject:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: Human-readable name.
      description: |-
        A project in an organization. Its members use its spaces, which hold
        memories.
      examples:
        - displayName: Agent
    CreateProjectMember:
      type: object
      required:
        - member
      properties:
        member:
          type: string
          description: |-
            The organization member added to the project:
            `organizations/{organization}/members/{member}`.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MemberRole'
          description: Roles the member holds in the project. Empty for a plain member.
      description: |-
        An organization member's membership in a project. Organization admins
        manage every project without being members.
      examples:
        - member: organizations/acme/members/0196f1b8-2d4f-7a1c-8e3b-5c6d7e8f9a02
          roles:
            - admin
    CreateSpace:
      type: object
      required:
        - project
        - displayName
      properties:
        project:
          type: string
          description: |-
            The project the space belongs to:
            `organizations/{organization}/projects/{project}`. It can't
            be changed later.
        displayName:
          type: string
          description: Human-readable name.
      description: |-
        A space holds memories, and is what agents query. Its ID is unique in the
        organization, and it belongs to a project, which decides who can use it.
      examples:
        - project: organizations/acme/projects/agent
          displayName: Notes
    Include:
      type: string
      enum:
        - permissions
      description: Extra data a get or list returns when asked for it.
    Invitation:
      type: object
      required:
        - name
        - email
        - state
        - organizationDisplayName
        - invitedBy
        - inviterEmail
        - createdAt
        - updatedAt
        - expiresAt
      properties:
        name:
          type: string
          description: 'Resource name: `organizations/{organization}/invitations/{invitation}`.'
          readOnly: true
        email:
          type: string
          format: email
          description: Email of the person invited.
        state:
          $ref: '#/components/schemas/InvitationState'
          description: Where the invitation stands.
          readOnly: true
        organizationDisplayName:
          type: string
          description: The organization's name when the invitation was sent.
          readOnly: true
        invitedBy:
          type: string
          description: 'Name of the user who sent it: `users/{user}`.'
          readOnly: true
        inviterEmail:
          type: string
          description: Email of the user who sent it.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When the invitation was sent.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When the invitation was last updated.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: After this, the invitation can no longer be accepted.
          x-ogen-time-format: 2006-01-02T15:04:05.999Z07:00
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          description: |-
            The methods the caller may call on this resource, such as `delete`.
            Returned only with `include=permissions`.
          readOnly: true
      description: |-
        An invitation to join an organization, addressed by email. The invitee
        accepts it by signing in with that email.
      examples:
        - name: organizations/acme/invitations/0196f1c4-9a2b-7e3d-8f1c-6a7b8c9d0e03
          email: bob@acme.example
          state: pending
          organizationDisplayName: Acme Corp
          invitedBy: users/9b2f4c1e-5a3d-4e7b-8c6f-1d2e3f4a5b6c
          inviterEmail: alice@acme.example
          createdAt: '2026-02-01T10:00:00Z'
          updatedAt: '2026-02-01T10:00:00Z'
          expiresAt: '2026-02-15T10:00:00Z'
    InvitationState:
      type: string
      enum:
        - pending
        - accepted
        - declined
      description: Where an invitation stands.
      examples:
        - pending
    ListInvitationsResponse:
      type: object
      required:
        - invitations
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
          description: The invitations on this page.
        nextPageToken:
          type: string
          description: Token for the next page. Absent on the last page.
        permissions:
          type: array
          items:
            type: string
          description: |-
            The methods the caller may call on the collection, such as `create`.
            Returned only with `include=permissions`, on every page, even when it has
            no items.
      description: A page of invitations.
      examples:
        - invitations:
            - name: organizations/acme/invitations/0196f1c4-9a2b-7e3d-8f1c-6a7b8c9d0e03
              email: bob@acme.example
              state: pending
