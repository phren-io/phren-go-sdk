  /v1/organizations/{organization}/invitations/{invitation}:accept:
    post:
      operationId: Invitations_accept
      description: |-
        Accept, joining the organization. Only the invitee can accept, while the
        invitation is pending and unexpired; otherwise it fails with 409.
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
          example: acme
        - name: invitation
          in: path
          required: true
          schema:
            type: string
          example: 0196f1c4-9a2b-7e3d-8f1c-6a7b8c9d0e03
      responses:
        '200':
          description: The request has succeeded.
          content:
