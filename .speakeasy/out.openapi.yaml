openapi: 3.1.0
info:
  title: Phren API
  version: 0.0.0
tags:
  - name: organizations
paths:
  /organizations:
    get:
      operationId: Organizations_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
      tags:
        - organizations
    post:
      operationId: Organizations_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
      tags:
        - organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
  /organizations/{organization}:
    get:
      operationId: Organizations_get
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
      tags:
        - organizations
    delete:
      operationId: Organizations_delete
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - organizations
components:
  schemas:
    Organization:
      type: object
      required:
        - name
        - displayName
      properties:
        name:
          type: string
          readOnly: true
        displayName:
          type: string
servers:
  - url: https://api.phren.io
    description: The production server
    variables: {}
  - url: https://staging.api.phren.io
    description: The staging server
    variables: {}
x-speakeasy-name-override:
  - operationId: ^.+_list$
    methodNameOverride: list
  - operationId: ^.+_get$
    methodNameOverride: get
  - operationId: ^.+_create$
    methodNameOverride: create
  - operationId: ^.+_delete$
    methodNameOverride: delete
