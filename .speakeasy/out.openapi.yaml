      tags:
        - organizations
    delete:
      operationId: Organizations_delete
      description: |-
        Soft-delete. Returns the organization `DELETED` once nobody but its
        admins can reach it or anything in it; its admins can still view and
        undelete it.
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: string
          example: acme
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          explode: false
          example: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                name: organizations/acme
                displayName: Acme Corp
                state: deleted
                createdBy: users/alice
                createdAt: '2026-01-15T09:30:00Z'
                updatedAt: '2026-04-01T10:00:00Z'
                deletedAt: '2026-04-01T10:00:00Z'
                purgesAt: '2026-05-01T10:00:00Z'
        '400':
          description: The request is malformed or fails validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The request has no bearer token, or the token is invalid or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller lacks permission for this resource, or it does not exist outside the caller's access.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The caller is authorized for the requested resources, but this one does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the resource's current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - organizations
  /v1/organizations/{organization}/invitations:
    get:
      operationId: Invitations_list
      description: |-
        List. Admins list an organization's invitations. With `-` as the
        organization, lists the pending invitations addressed to the caller's
        email, across organizations.
      parameters:
        - name: pageSize
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
          examples:
            Addressed to me:
              summary: Addressed to me
              value: 50
            An organization's:
              summary: An organization's
              value: 50
        - name: pageToken
          in: query
          required: false
          description: Token from a previous response's nextPageToken.
          schema:
            type: string
          explode: false
        - name: filter
