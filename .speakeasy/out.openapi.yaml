          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
          examples:
            Addressed to me:
              summary: Addressed to me
              value: 50
            An organization's:
              summary: An organization's
              value: 50
        - name: pageToken
