openapi: 3.1.0
info:
  title: Phren API
  version: 0.0.0
tags:
  - name: organizations
  - name: organizationOperations
  - name: members
  - name: invitations
  - name: projects
  - name: projectMembers
  - name: spaces
  - name: spaceOperations
